name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/upload assets for (e.g. v1.2.3). Leave empty for a normal release-please run."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Open or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    needs: [release-please]
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      inputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}" release/*.* --clobber
